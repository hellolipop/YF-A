<!DOCTYPE html>
<html lang="zh-CN" data-color="cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaDesk · A股 / 美股实时分析终端</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234d8dff'/><path d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AD</span>
      <div class="brand-text">
        <strong>AlphaDesk</strong>
        <span>A股 · 美股实时分析终端</span>
      </div>
    </div>

    <div class="market-switch" id="market-switch" role="tablist" aria-label="市场切换">
      <button data-market="cn" class="active" role="tab">A股</button>
      <button data-market="us" role="tab">美股</button>
    </div>

    <!-- 美股数据源（仅美股时出现）：常规时段按美东交易日；币安 bStocks 是 1:1 代币化美股，7×24 -->
    <div class="market-switch sub hidden" id="us-source" role="tablist" aria-label="美股数据源">
      <button data-src="" class="active" role="tab" title="腾讯 / 东财：按美股交易日口径（美东开盘 / 收盘），盘后与周末是静态价">常规时段</button>
      <button data-src="binance" role="tab" title="币安 bStocks（1:1 代币化美股）：7×24 连续行情，盘后与周末也能看到成交；口径差异见个股详情页说明">币安 7×24</button>
    </div>

    <button class="search-trigger" id="search-trigger">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <span>搜索代码 / 名称 / 拼音</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="topbar-right">
      <div class="session" id="session-badge" title="交易时段状态">
        <i class="dot"></i><span>连接中</span>
      </div>
      <div class="clock" id="clock">--:--:--</div>
      <button class="icon-btn" id="refresh-btn" title="立即刷新">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97M13.5 2.5v3.2h-3.2"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="设置">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail">
      <button class="rail-item active" data-view="market">
        <svg viewBox="0 0 18 18"><path d="M2 12.5l4-4.5 3 2.6 6.5-7"/><path d="M2 16h14"/></svg><span>市场总览</span>
      </button>
      <button class="rail-item" data-view="watchlist">
        <svg viewBox="0 0 18 18"><path d="M9 2.2l2.1 4.4 4.7.6-3.5 3.2.9 4.7L9 12.8l-4.2 2.3.9-4.7L2.2 7.2l4.7-.6z"/></svg><span>自选股</span>
      </button>
      <button class="rail-item" data-view="detail">
        <svg viewBox="0 0 18 18"><path d="M2 14l4.2-6 3.2 3 6.4-8"/><path d="M2 16.4h14"/></svg><span>个股详情</span>
      </button>
      <button class="rail-item" data-view="screener">
        <svg viewBox="0 0 18 18"><path d="M2.5 4h13M4.6 8h8.8M7 12h4"/><path d="M9 14.4v1.4"/></svg><span>选股器</span>
      </button>
      <button class="rail-item" data-view="scan">
        <svg viewBox="0 0 18 18"><circle cx="8" cy="8" r="4.6"/><path d="M11.6 11.6l3.6 3.6"/><path d="M6.4 8.4l1.2 1.2 2.4-2.6"/></svg><span>买入扫描</span>
      </button>
      <button class="rail-item" data-view="trade">
        <svg viewBox="0 0 18 18"><path d="M2.6 13.4l3.6-3.6 2.6 2.6 5.6-6.4"/><path d="M11.4 4.6h3.9v3.9"/><path d="M2.6 15.6h12.8"/></svg><span>模拟交易</span>
      </button>
      <button class="rail-item" data-view="advisor">
        <svg viewBox="0 0 18 18"><path d="M8.2 2.2l1.5 3.9 3.9 1.5-3.9 1.5-1.5 3.9-1.5-3.9L2.8 7.6l3.9-1.5z"/><path d="M13.9 11.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg><span>AI 选股</span>
      </button>
      <button class="rail-item" data-view="features">
        <svg viewBox="0 0 18 18"><path d="M2.4 3h13.2M2.4 7.5h13.2M2.4 12h8"/><circle cx="13.6" cy="13.2" r="2.4"/></svg><span>盘口事件</span>
      </button>
      <button class="rail-item" data-view="backtest">
        <svg viewBox="0 0 18 18"><path d="M2.6 15.4V8.6M6.9 15.4V3.4M11.2 15.4v-5M15.5 15.4V6"/></svg><span>策略回测</span>
      </button>
      <button class="rail-item" data-view="tracker">
        <svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.4"/><path d="M9 5.4v3.9l2.7 1.6"/><path d="M2.4 4.2V2h2.2M15.6 13.8V16h-2.2"/></svg><span>策略跟踪</span>
        <em class="badge hidden" id="tracker-badge">0</em>
      </button>
      <button class="rail-item" data-view="system">
        <svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2.2M9 14v2.2M1.8 9H4M14 9h2.2M3.9 3.9l1.6 1.6M12.5 12.5l1.6 1.6M14.1 3.9l-1.6 1.6M5.5 12.5l-1.6 1.6"/></svg><span>运行状态</span>
      </button>
      <button class="rail-item" data-view="alerts">
        <svg viewBox="0 0 18 18"><path d="M9 2.2a4.7 4.7 0 0 0-4.7 4.7c0 4-1.6 5.2-1.6 5.2h12.6s-1.6-1.2-1.6-5.2A4.7 4.7 0 0 0 9 2.2z"/><path d="M7.4 14.6a1.9 1.9 0 0 0 3.2 0"/></svg><span>预警中心</span>
        <em class="badge hidden" id="alert-badge">0</em>
      </button>
      <button class="rail-item" data-view="news">
        <svg viewBox="0 0 18 18"><path d="M3 2.6h9.4l2.6 2.6v10.2H3z"/><path d="M5.6 6.6h6.8M5.6 9.4h6.8M5.6 12.2h4"/></svg><span>资讯快讯</span>
      </button>
      <div class="rail-foot">
        <div class="rail-note">数据源<br><span id="src-note">腾讯行情 · 东方财富</span></div>
      </div>
    </nav>

    <main id="view-root" class="view-root"></main>
  </div>

  <div class="palette hidden" id="palette">
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
        <input id="palette-input" placeholder="输入股票代码、名称或拼音，如 600519 / 茅台 / AAPL / 特斯拉" autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-foot">↑↓ 选择 · Enter 打开 · ⌘K 唤起</div>
    </div>
  </div>

  <div class="drawer hidden" id="drawer">
    <aside class="drawer-panel">
      <header>
        <h3>设置</h3>
        <button class="icon-btn" id="drawer-close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <div id="toasts" class="toasts"></div>
</div>

<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
<script src="/js/stream.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/indicators.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/views/market.js"></script>
<script src="/js/views/watchlist.js"></script>
<script src="/js/views/detail.js"></script>
<script src="/js/views/screener.js"></script>
<script src="/js/views/features.js"></script>
<script src="/js/views/backtest.js"></script>
<script src="/js/views/tracker.js"></script>
<script src="/js/views/system.js"></script>
<script src="/js/views/alerts.js"></script>
<script src="/js/views/news.js"></script>
<script src="/js/views/advisor.js"></script>
<script src="/js/views/scan.js"></script>
<script src="/js/views/trade.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
